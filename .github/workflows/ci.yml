name: Deploy GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build Jekyll
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Jekyll and plugins
        run: |
          gem install jekyll -v 4.4.1 --no-document
          gem install jekyll-paginate -v 1.1.0 --no-document
          gem install jekyll-sitemap -v 1.4.0 --no-document
          gem install kramdown-parser-gfm --no-document
          gem install webrick --no-document

      - name: Build site
        run: |
          rm -rf _site
          jekyll build --future --destination ./_site
          test -f _site/index.html
          test -f _site/uygulamalar/index.html
          grep -q "MevzuHakkım" _site/uygulamalar/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    name: Deploy Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
